# Perfil de empresa: todo lo que cambia de una empresa a otra.
#
# Junto a este archivo van:
#   documentos/<categoría>/...   los documentos a indexar (no se incluyen en la imagen)
#   preguntas_eval.json          el set de evaluación de esta empresa
#
# Se elige con la variable de entorno PERFIL (por defecto, perfiles/techretail).

# Identificador corto: nombra la colección de la base vectorial (<id>_docs).
id = "techretail"

[empresa]
nombre = "TechRetail Solutions S.R.L."
# Completa la frase "el asistente interno de <nombre>, <descripción>".
descripcion = "una plataforma SaaS de e-commerce para PyMEs y emprendedores en Argentina"

[asistente]
nombre = "TechRetAI"
# Parte final del nombre que se muestra con el color de acento (opcional).
resaltado = "AI"
descripcion = "Asistente corporativo de TechRetail Solutions"
bienvenida = "Preguntá lo que necesites sobre la documentación interna de la empresa."

# Nombre visible de cada subcarpeta de documentos/.
[categorias]
rrhh = "RR. HH."
financiero = "Financiero"
legal = "Legal"
operacional = "Operaciones"
comercial = "Comercial"
estrategico = "Estratégico"
datos_sistemas = "Datos y sistemas"

# Preguntas sugeridas en la pantalla de inicio (íconos de Material Symbols).
[[sugerencias]]
icono = ":material/beach_access:"
texto = "¿Cuántos días de vacaciones me corresponden con 6 años de antigüedad?"

[[sugerencias]]
icono = ":material/credit_card:"
texto = "¿Qué comisión cobra MercadoPago por tarjeta de crédito?"

[[sugerencias]]
icono = ":material/sell:"
texto = "¿Cuánto cuesta el plan Growth y qué incluye?"

[[sugerencias]]
icono = ":material/receipt_long:"
texto = "¿Cómo funciona la facturación automática contra ARCA?"
