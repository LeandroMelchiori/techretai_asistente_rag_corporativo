# Perfil de una tienda ficticia: muestra que el mismo asistente sirve para otra
# empresa sin tocar código. Ver perfiles/techretail/perfil.toml para la referencia
# de cada campo.

id = "nogal"

[empresa]
nombre = "Nogal Deco"
descripcion = "una tienda de decoración, iluminación y bazar de Rosario que vende por Mercado Libre y por su tienda online"

[asistente]
nombre = "Asistente Nogal"
descripcion = "Asistente interno de Nogal Deco"
bienvenida = "Preguntá por envíos, pagos, cambios, garantías o cómo responder en Mercado Libre."

[categorias]
ventas = "Ventas"
envios = "Envíos"
postventa = "Postventa"
atencion = "Atención al cliente"

# Conectores a las cuentas de la empresa. "demo" usa los datos ficticios de
# demo/mercadolibre.json. Con conectores, el asistente funciona como agente.
[conectores]
mercadolibre = "demo"

[[sugerencias]]
icono = ":material/forum:"
texto = "¿Qué preguntas tengo sin responder en Mercado Libre?"

[[sugerencias]]
icono = ":material/report:"
texto = "¿Qué hago con el reclamo de las copas rotas?"

[[sugerencias]]
icono = ":material/local_shipping:"
texto = "¿Hay pedidos demorados?"

[[sugerencias]]
icono = ":material/assignment_return:"
texto = "Un cliente quiere devolver una lámpara a los 20 días de recibirla, ¿se puede?"
