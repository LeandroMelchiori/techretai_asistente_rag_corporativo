name: Deploy a OCI

# Cuando los tests de main pasan, construye la imagen ARM64 y la publica en GHCR.
# La VM la toma sola: un temporizador revisa la imagen :main y la despliega, con
# rollback si no queda healthy. GitHub no necesita acceso SSH ni credenciales de OCI.
# El job final espera a que la versión nueva esté en producción.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-oci
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/leandromelchiori/techretai

jobs:
  publicar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Versión a publicar
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ steps.version.outputs.sha }}
          tags: |
            ${{ env.IMAGEN }}:${{ steps.version.outputs.sha }}
            ${{ env.IMAGEN }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verificar:
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - name: Esperar la versión nueva en producción
        env:
          SHA: ${{ needs.publicar.outputs.sha }}
        run: |
          for i in $(seq 1 40); do
            actual=$(curl -fsS --max-time 10 https://techretai.sachadev.me/app/static/version.txt || true)
            if [ "$actual" = "$SHA" ]; then
              echo "En producción: $SHA"
              exit 0
            fi
            echo "Producción todavía en: ${actual:-?}"
            sleep 15
          done
          echo "La versión $SHA no llegó a producción en 10 minutos." >&2
          exit 1
